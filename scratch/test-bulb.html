<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #fff; padding: 100px; display: flex; justify-content: center; }
  .bulb {
    width: 120px;
    height: 120px;
    background: transparent;
    border: 3px solid #ccc;
    border-radius: 50%;
    position: relative;
  }
  .bulb::before {
    content: '';
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 40px;
    border: 3px solid #ccc;
    border-bottom: none;
    border-top: none;
    background: transparent;
  }
  
  /* Trying the pear shape */
  .bulb-pear {
    position: relative;
    width: 130px;
    height: 130px;
    background: radial-gradient(circle at 45% 45%, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.05) 40%, rgba(0, 0, 0, 0.1) 80%, rgba(0, 0, 0, 0.3) 100%);
    border-radius: 50%;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.1), inset 0 0 5px rgba(255,255,255,0.5);
    z-index: 2;
  }
  .bulb-pear::before {
    content: '';
    position: absolute;
    top: -55px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 80px;
    background: radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.05) 40%, rgba(0, 0, 0, 0.1) 80%, rgba(0, 0, 0, 0.3) 100%);
    border-radius: 20px 20px 50% 50%;
    clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.1), inset 0 0 5px rgba(255,255,255,0.5);
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="bulb-pear"></div>
</body>
</html>
