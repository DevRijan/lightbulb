<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #fff; padding: 100px; display: flex; justify-content: center; }
  
  .bulb-pear {
    position: relative;
    width: 130px;
    height: 180px; /* Taller to accommodate the neck */
    /* Use radial gradient with a flattened bottom for the sphere, and a conical/linear gradient for the neck */
    background: 
      /* Top Sphere */
      radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.05) 50%, transparent 60%),
      /* Main Glass Body - creating the pear shape with border-radius and clip-path */
      linear-gradient(to bottom, rgba(200,200,200,0.1), rgba(0,0,0,0.2));
    /* The magic shape: top is a perfect circle, bottom tapers in */
    border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
    /* Refine the bottom taper using clip-path or masking if needed, but a complex border-radius often works */
    border: 3px solid rgba(0,0,0,0.2);
    box-shadow: inset 0 0 15px rgba(0,0,0,0.2), inset 0 0 5px rgba(255,255,255,0.5);
  }
</style>
</head>
<body>
  <div class="bulb-pear"></div>
</body>
</html>
